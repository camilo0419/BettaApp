{% extends 'tienda/base.html' %}

{% block title %}Ingreso produccion | Betta Diseno{% endblock %}

{% block content %}
<section class="section login-section">
  <div class="login-card">
    <span class="eyebrow">Betta Diseno</span>
    <h1>Produccion</h1>
    <p>Ingreso para equipo operativo.</p>
    <form method="post" class="dynamic-form">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-wide">Ingresar</button>
    </form>
  </div>
</section>
{% endblock %}
