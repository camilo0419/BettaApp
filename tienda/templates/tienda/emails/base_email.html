<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Betta Dise&ntilde;o{% endblock %}</title>
</head>
<body style="margin:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e5e9f2;">
          <tr>
            <td style="padding:22px 26px;background:#172033;color:#ffffff;">
              <strong style="font-size:20px;">{{ from_name|default:'Betta Diseño' }}</strong>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 26px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 26px;background:#f5f7fb;color:#6b7280;font-size:13px;">
              Este correo fue enviado por Betta. Si no esperabas este mensaje, puedes ignorarlo.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
