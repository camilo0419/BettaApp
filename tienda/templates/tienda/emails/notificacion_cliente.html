{% extends 'tienda/emails/base_email.html' %}
{% block title %}{{ notificacion.titulo }}{% endblock %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:22px;color:#172033;">{{ notificacion.titulo }}</h1>
<p style="margin:0 0 22px;line-height:1.6;">{{ notificacion.mensaje }}</p>
{% if notificacion.url_destino %}
<a href="{{ site_url }}{{ notificacion.url_destino }}" style="display:inline-block;background:#172033;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:bold;">Ver detalle</a>
{% endif %}
{% endblock %}
