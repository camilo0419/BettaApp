{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña | Portal cliente</title>
  <link rel="stylesheet" href="{% static 'tienda/css/styles.css' %}">
</head>
<body class="client-auth-body">
  <main class="client-auth">
    <section class="client-auth-card">
      <img src="{% static 'tienda/img/marca/betta-logo-text.jpeg' %}" alt="Betta Dise&ntilde;o">
      <h1>Nueva contraseña</h1>
      {% if validlink %}
      <form method="post" class="dynamic-form">
        {% csrf_token %}
        {% for field in form %}
          <div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
        {% endfor %}
        <button class="btn btn-primary btn-wide">Guardar contraseña</button>
      </form>
      {% else %}
      <p>El enlace no es valido o ya expiro.</p>
      <a href="{% url 'cliente_password_reset' %}" class="btn btn-outline">Solicitar otro enlace</a>
      {% endif %}
    </section>
  </main>
</body>
</html>
