{% if page_obj.has_other_pages %}<div class="table-actions" style="margin-top:1rem;display:flex;justify-content:space-between;gap:1rem;">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}">Anterior</a>{% else %}<span></span>{% endif %}<span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}</div>{% endif %}
