{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin productos | Betta Diseño{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'tienda/css/styles.css' %}">
</head>
<body class="panel-body">
<aside class="panel-sidebar">
  <a href="{% url 'panel_dashboard' %}" class="panel-brand">
    <img src="{% static 'tienda/img/marca/betta-logo-text.jpeg' %}" alt="Betta Diseño">
    <span>Admin productos</span>
  </a>
  <nav>
    <a href="{% url 'panel_dashboard' %}">Dashboard</a>
    <a href="{% url 'panel_solicitudes' %}">Solicitudes</a>
    <a href="{% url 'panel_productos' %}">Productos</a>
    <a href="{% url 'panel_campos_maestros' %}">Campos maestros</a>
    <a href="{% url 'home' %}" target="_blank">Ver tienda</a>
    <a href="#" onclick="event.preventDefault(); document.getElementById('panel-logout-form').submit();">Salir</a>
  </nav>
  <form id="panel-logout-form" method="post" action="{% url 'panel_logout' %}" style="display:none;">
    {% csrf_token %}
  </form>
</aside>
<main class="panel-main">
  {% if messages %}
    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
